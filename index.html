<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kalkulator x̄ Gabungan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --border: #2e3247;
    --accent: #6ee7b7;
    --accent2: #818cf8;
    --accent3: #f472b6;
    --text: #e8eaf6;
    --muted: #7c82a8;
    --error: #f87171;
    --gold: #fbbf24;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html { overflow-x: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px 16px 80px;
    overflow-x: hidden;
    width: 100%;
    background-image:
      radial-gradient(ellipse 80% 40% at 20% -5%, rgba(110,231,183,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(129,140,248,0.07) 0%, transparent 60%);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    margin-bottom: 24px;
  }

  .header-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(26px, 7vw, 42px);
    line-height: 1.1;
  }
  header h1 span { color: var(--accent); font-style: italic; }

  header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.6;
  }

  /* ── FORMULA ── */
  .formula-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
    text-align: center;
  }

  .ftitle {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
  }

  .formula {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(13px, 4vw, 20px);
    color: var(--accent2);
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .formula::-webkit-scrollbar { display: none; }
  .formula sub { font-size: 0.65em; }

  /* ── EXAMPLES ── */
  .examples-section { margin-bottom: 20px; }

  .examples-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 10px;
    text-align: center;
  }

  .example-btns {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ex-btn {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    line-height: 1.4;
    touch-action: manipulation;
    transition: all 0.15s;
    min-height: 48px;
  }
  .ex-btn:active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(110,231,183,0.07);
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 16px 22px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3));
  }

  .card-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 18px;
    font-family: 'DM Mono', monospace;
  }

  /* ── TARGET SELECTOR ── */
  .target-section { margin-bottom: 20px; }

  .target-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 700;
  }

  .target-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .target-btn {
    padding: 9px 15px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
    min-height: 42px;
    display: flex;
    align-items: center;
  }
  .target-btn:active { transform: scale(0.96); }
  .target-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
    font-weight: 700;
  }

  /* ── GROUPS ── */
  .groups-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 400px) {
    .groups-wrapper { grid-template-columns: 1fr; }
  }

  .group-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 12px;
  }

  .group-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot-1 { background: var(--accent); }
  .dot-2 { background: var(--accent3); }

  .group-name {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'DM Mono', monospace;
  }
  .g1 { color: var(--accent); }
  .g2 { color: var(--accent3); }

  /* ── INPUT FIELDS ── */
  .input-group { margin-bottom: 10px; }
  .input-group:last-child { margin-bottom: 0; }

  .input-group label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }

  /* font-size: 16px prevents iOS auto-zoom */
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    color: var(--text);
    font-size: 16px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: textfield;
    min-height: 46px;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(129,140,248,0.15);
  }
  input[type="number"].disabled-field {
    border-style: dashed;
    border-color: var(--accent2);
    background: rgba(129,140,248,0.08);
    color: var(--accent2);
  }
  input[type="number"]::placeholder {
    color: var(--muted);
    opacity: 0.5;
    font-size: 13px;
  }

  /* ── XBAR GABUNGAN ROW ── */
  .xbar-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .xbar-row label {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .xbar-row input[type="number"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(251,191,36,0.15);
  }
  .xbar-row input[type="number"].disabled-field {
    border-color: var(--gold);
    background: rgba(251,191,36,0.08);
    color: var(--gold);
  }

  /* ── ERROR ── */
  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--error);
    margin-bottom: 14px;
    display: none;
    line-height: 1.5;
  }
  .error-msg.show { display: block; }

  /* ── SOLVE BUTTON ── */
  .solve-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.15s, transform 0.1s;
    min-height: 54px;
  }
  .solve-btn:active { opacity: 0.85; transform: scale(0.99); }

  /* ── RESULT ── */
  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 18px;
    padding: 22px 16px;
    margin-bottom: 20px;
    display: none;
    animation: fadeUp 0.35s ease;
  }
  .result-card.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    margin-bottom: 6px;
  }

  .result-value {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 11vw, 54px);
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
    word-break: break-all;
  }

  .result-name {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .steps-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: 'DM Mono', monospace;
  }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.6;
  }

  .step-num {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 24px; height: 24px; min-width: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    color: var(--accent2);
    flex-shrink: 0;
    margin-top: 2px;
  }

  .step-text {
    color: var(--text);
    overflow-wrap: break-word;
    min-width: 0;
    flex: 1;
  }

  .step-text .eq {
    font-family: 'DM Mono', monospace;
    color: var(--accent2);
    font-size: 12px;
    display: block;
    margin-top: 2px;
    word-break: break-all;
  }

  /* ── RESET ── */
  .reset-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    color: var(--muted);
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
    min-height: 50px;
  }
  .reset-btn:active {
    border-color: var(--muted);
    color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-label">Statistika · SMA / SMK</div>
    <h1>Rata-rata <span>Gabungan</span></h1>
    <p>Pilih variabel yang dicari, isi nilai yang diketahui, lalu hitung.</p>
  </header>

  <div class="formula-box">
    <div class="ftitle">Rumus</div>
    <div class="formula">
      x̄<sub>gab</sub> = (n<sub>1</sub>·x̄<sub>1</sub> + n<sub>2</sub>·x̄<sub>2</sub>) ÷ (n<sub>1</sub> + n<sub>2</sub>)
    </div>
  </div>

  <div class="examples-section">
    <div class="examples-title">✦ Contoh Soal ✦</div>
    <div class="example-btns">
      <button class="ex-btn" onclick="loadExample(1)">📚 Contoh 1 — Cari banyak siswi (n₂)</button>
      <button class="ex-btn" onclick="loadExample(2)">⚖️ Contoh 2 — Cari rata-rata kelompok baru (x̄₂)</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Input Data</div>

    <div class="target-section">
      <div class="target-label">Yang dicari — klik untuk memilih:</div>
      <div class="target-grid">
        <button class="target-btn" data-val="xgab"  onclick="setTarget('xgab')">x̄ gabungan</button>
        <button class="target-btn" data-val="n1"    onclick="setTarget('n1')">n₁</button>
        <button class="target-btn" data-val="xbar1" onclick="setTarget('xbar1')">x̄₁</button>
        <button class="target-btn" data-val="n2"    onclick="setTarget('n2')">n₂</button>
        <button class="target-btn" data-val="xbar2" onclick="setTarget('xbar2')">x̄₂</button>
      </div>
    </div>

    <div class="groups-wrapper">
      <div class="group-card">
        <div class="group-header">
          <div class="group-dot dot-1"></div>
          <div class="group-name g1">Kelompok 1</div>
        </div>
        <div class="input-group">
          <label for="n1">n₁ — Banyak data</label>
          <input type="number" id="n1" inputmode="decimal" placeholder="cth: 20" min="1" oninput="onInputChange()">
        </div>
        <div class="input-group">
          <label for="xbar1">x̄₁ — Rata-rata</label>
          <input type="number" id="xbar1" inputmode="decimal" placeholder="cth: 75.5" step="any" oninput="onInputChange()">
        </div>
      </div>
      <div class="group-card">
        <div class="group-header">
          <div class="group-dot dot-2"></div>
          <div class="group-name g2">Kelompok 2</div>
        </div>
        <div class="input-group">
          <label for="n2">n₂ — Banyak data</label>
          <input type="number" id="n2" inputmode="decimal" placeholder="cth: ?" min="1" oninput="onInputChange()">
        </div>
        <div class="input-group">
          <label for="xbar2">x̄₂ — Rata-rata</label>
          <input type="number" id="xbar2" inputmode="decimal" placeholder="cth: 80" step="any" oninput="onInputChange()">
        </div>
      </div>
    </div>

    <div class="xbar-row">
      <label for="xgab">x̄ gab</label>
      <input type="number" id="xgab" inputmode="decimal" placeholder="cth: 77.5" step="any" oninput="onInputChange()">
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button class="solve-btn" onclick="solve()">✦ Hitung Sekarang</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-label">Hasil</div>
    <div class="result-value" id="resultValue">—</div>
    <div class="result-name" id="resultName"></div>
    <div class="steps-title">Langkah Penyelesaian</div>
    <div id="stepsContainer"></div>
  </div>

  <button class="reset-btn" onclick="resetAll()">↺ Reset Semua</button>

</div>

<script>
let target = null;

function setTarget(v) {
  target = v;
  document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-val="' + v + '"]').classList.add('active');
  ['n1','xbar1','n2','xbar2','xgab'].forEach(function(id) {
    var el = document.getElementById(id);
    el.classList.remove('disabled-field');
    el.readOnly = false;
  });
  var t = document.getElementById(v);
  t.classList.add('disabled-field');
  t.readOnly = true;
  t.value = '';
  t.placeholder = '? (yang dicari)';
  // hide result when changing target
  document.getElementById('resultCard').classList.remove('show');
  hideError();
}

function onInputChange() { hideError(); }
function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function getVal(id) {
  var v = document.getElementById(id).value;
  return (v === '' || v === null) ? null : parseFloat(v);
}

function fmt(n) { return parseFloat(n.toFixed(4)).toString(); }

function solve() {
  hideError();
  if (!target) { showError('Pilih dulu variabel yang ingin dicari.'); return; }

  var n1 = getVal('n1'), xb1 = getVal('xbar1'),
      n2 = getVal('n2'), xb2 = getVal('xbar2'),
      xgab = getVal('xgab');

  var result = null, steps = [], resultName = '';

  try {
    if (target === 'xgab') {
      if (n1===null||xb1===null||n2===null||xb2===null) { showError('Lengkapi: n₁, x̄₁, n₂, x̄₂.'); return; }
      var num = n1*xb1 + n2*xb2, den = n1+n2;
      result = num/den; resultName = 'x̄ Gabungan';
      steps = [
        {t:'Tulis rumus', eq:'x̄_gab = (n₁·x̄₁ + n₂·x̄₂) ÷ (n₁+n₂)'},
        {t:'Substitusi',  eq:'= ('+n1+'×'+xb1+' + '+n2+'×'+xb2+') ÷ ('+n1+'+'+n2+')'},
        {t:'Hitung',      eq:'= '+num+' ÷ '+den},
        {t:'Hasil',       eq:'x̄_gab = '+fmt(result)},
      ];
    } else if (target === 'n1') {
      if (xb1===null||n2===null||xb2===null||xgab===null) { showError('Lengkapi: x̄₁, n₂, x̄₂, x̄_gab.'); return; }
      var d = xgab - xb1;
      if (Math.abs(d) < 1e-9) { showError('x̄_gab sama dengan x̄₁, pembagi = 0.'); return; }
      result = n2*(xb2-xgab)/d; resultName = 'n₁ (Banyak data kelompok 1)';
      steps = [
        {t:'Dari rumus',      eq:'x̄_gab(n₁+n₂) = n₁·x̄₁ + n₂·x̄₂'},
        {t:'Substitusi',      eq:xgab+'(n₁+'+n2+') = n₁×'+xb1+' + '+n2+'×'+xb2},
        {t:'Pindah ruas',     eq:'n₁·('+xgab+'−'+xb1+') = '+n2*(xb2-xgab)},
        {t:'Bagi kedua sisi', eq:'n₁ × '+d+' = '+n2*(xb2-xgab)},
        {t:'Hasil',           eq:'n₁ = '+fmt(result)},
      ];
    } else if (target === 'xbar1') {
      if (n1===null||n2===null||xb2===null||xgab===null) { showError('Lengkapi: n₁, n₂, x̄₂, x̄_gab.'); return; }
      var total = xgab*(n1+n2);
      result = (total - n2*xb2)/n1; resultName = 'x̄₁ (Rata-rata kelompok 1)';
      steps = [
        {t:'Dari rumus', eq:'x̄₁ = [x̄_gab(n₁+n₂) − n₂·x̄₂] ÷ n₁'},
        {t:'Substitusi', eq:'= ['+xgab+'('+n1+'+'+n2+') − '+n2+'×'+xb2+'] ÷ '+n1},
        {t:'Hitung',     eq:'= ['+total+' − '+n2*xb2+'] ÷ '+n1+' = '+(total-n2*xb2)+' ÷ '+n1},
        {t:'Hasil',      eq:'x̄₁ = '+fmt(result)},
      ];
    } else if (target === 'n2') {
      if (n1===null||xb1===null||xb2===null||xgab===null) { showError('Lengkapi: n₁, x̄₁, x̄₂, x̄_gab.'); return; }
      var d2 = xgab - xb2;
      if (Math.abs(d2) < 1e-9) { showError('x̄_gab sama dengan x̄₂, pembagi = 0.'); return; }
      result = n1*(xb1-xgab)/d2; resultName = 'n₂ (Banyak data kelompok 2)';
      steps = [
        {t:'Dari rumus',      eq:'x̄_gab(n₁+n₂) = n₁·x̄₁ + n₂·x̄₂'},
        {t:'Substitusi',      eq:xgab+'('+n1+'+n₂) = '+n1+'×'+xb1+' + n₂×'+xb2},
        {t:'Pindah ruas',     eq:'n₂·('+xgab+'−'+xb2+') = '+n1*(xb1-xgab)},
        {t:'Bagi kedua sisi', eq:'n₂ × '+d2+' = '+n1*(xb1-xgab)},
        {t:'Hasil',           eq:'n₂ = '+fmt(result)},
      ];
    } else if (target === 'xbar2') {
      if (n1===null||xb1===null||n2===null||xgab===null) { showError('Lengkapi: n₁, x̄₁, n₂, x̄_gab.'); return; }
      var total2 = xgab*(n1+n2);
      result = (total2 - n1*xb1)/n2; resultName = 'x̄₂ (Rata-rata kelompok 2)';
      steps = [
        {t:'Dari rumus', eq:'x̄₂ = [x̄_gab(n₁+n₂) − n₁·x̄₁] ÷ n₂'},
        {t:'Substitusi', eq:'= ['+xgab+'('+n1+'+'+n2+') − '+n1+'×'+xb1+'] ÷ '+n2},
        {t:'Hitung',     eq:'= ['+total2+' − '+n1*xb1+'] ÷ '+n2+' = '+(total2-n1*xb1)+' ÷ '+n2},
        {t:'Hasil',      eq:'x̄₂ = '+fmt(result)},
      ];
    }

    if (result === null) return;

    if (result < 0 && (target === 'n1' || target === 'n2')) {
      showError('Hasil negatif — periksa kembali nilai. Banyak data tidak mungkin negatif.');
      return;
    }

    document.getElementById('resultValue').textContent = fmt(result);
    document.getElementById('resultName').textContent = resultName;

    var cont = document.getElementById('stepsContainer');
    cont.innerHTML = steps.map(function(s, i) {
      return '<div class="step"><div class="step-num">'+(i+1)+'</div>'
           + '<div class="step-text"><strong>'+s.t+':</strong>'
           + '<span class="eq">'+s.eq+'</span></div></div>';
    }).join('');

    var rc = document.getElementById('resultCard');
    rc.classList.add('show');
    setTimeout(function() { rc.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);

  } catch(e) {
    showError('Terjadi kesalahan. Cek kembali nilai yang dimasukkan.');
  }
}

function loadExample(n) {
  resetAll(true);
  if (n === 1) {
    setTarget('n2');
    // fix: unlock target field briefly so value assignment works on Safari
    var t = document.getElementById('n2');
    t.readOnly = false;
    document.getElementById('xgab').value  = 77.5;
    document.getElementById('n1').value    = 20;
    document.getElementById('xbar1').value = 75.5;
    document.getElementById('xbar2').value = 80;
    t.readOnly = true;
  } else {
    setTarget('xbar2');
    var t2 = document.getElementById('xbar2');
    t2.readOnly = false;
    document.getElementById('n1').value    = 12;
    document.getElementById('xbar1').value = 52;
    document.getElementById('n2').value    = 8;
    document.getElementById('xgab').value  = 48;
    t2.readOnly = true;
  }
  setTimeout(function() {
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 60);
}

function resetAll(silent) {
  target = null;
  document.querySelectorAll('.target-btn').forEach(function(b) { b.classList.remove('active'); });
  var defs = { n1:'cth: 20', xbar1:'cth: 75.5', n2:'cth: ?', xbar2:'cth: 80', xgab:'cth: 77.5' };
  Object.keys(defs).forEach(function(id) {
    var el = document.getElementById(id);
    el.value = '';
    el.readOnly = false;
    el.classList.remove('disabled-field');
    el.placeholder = defs[id];
  });
  document.getElementById('resultCard').classList.remove('show');
  hideError();
  if (!silent) window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
